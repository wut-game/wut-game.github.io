<html lang="en">
<head>
<meta charset="utf-8">

<meta property="og:title" content="Wut?! – The multiplayer quiz">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;justify-content:center;background:linear-gradient(180deg,#491D99,#2A0E5C);color:#fff;font-family:Figtree,system-ui,sans-serif;overflow-x:hidden}
a{text-decoration:none;color:inherit}
.wrap{width:100%;max-width:420px;min-height:100vh;padding:72px 24px 40px;display:flex;flex-direction:column;align-items:center}
.logo{width:120px;height:120px;border-radius:30px;background:#5C2AAE;border:2px solid rgba(255,255,255,.3);box-shadow:0 10px 30px rgba(0,0,0,.25);display:flex;align-items:center;justify-content:center;overflow:hidden;font-size:40px;font-weight:800;letter-spacing:-1px}
.logo img{width:100%;height:100%;object-fit:cover;display:block}
.logo span,h1 span{color:#FF6261}
h1{margin:28px 0 12px;font-size:34px;font-weight:800;letter-spacing:-.5px}
.desc{max-width:320px;margin:0;font-size:16px;line-height:24px;color:rgba(255,255,255,.8);text-align:center}
.get{margin:40px 0 16px;font-size:14px;font-weight:600}
.tiles{display:flex;gap:20px;justify-content:center}
.tile{width:150px;height:150px;border-radius:24px;background:#2E1665;border:1.5px solid rgba(255,255,255,.25);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:0 10px;text-align:center;font-size:15px;font-weight:700;line-height:20px}
.tile:hover{background:#38197a}
.hidden{display:none!important}
.bar{width:100%;display:flex;align-items:center;height:44px}
.back{flex:none;width:36px;height:36px;border-radius:18px;background:#2E1665;display:flex;align-items:center;justify-content:center}
.bar .t{flex-grow:1;text-align:center;font-size:16px;font-weight:600;margin-right:36px}
.intro{margin:14px 0 18px;font-size:14px;line-height:20px;color:rgba(255,255,255,.75);text-align:center}
.card{width:100%;background:#2E1665;border-radius:20px;padding:16px;margin-bottom:14px}
.head{display:flex;align-items:center;gap:12px;font-size:16px;font-weight:700}
.n{flex:none;width:28px;height:28px;border-radius:14px;background:#5C2AAE;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700}
.demo{position:relative;height:150px;border-radius:14px;background:#F4F4F6;overflow:hidden;color:#1D1D22;margin-top:12px}
.demo .top{height:22px;background:#E1E1E6;display:flex;align-items:center;gap:4px;padding:0 10px}
.demo .top i{width:6px;height:6px;border-radius:3px;background:#B5B5BD}
.demo .g{position:absolute;left:14px;top:40px;font-size:15px;font-weight:700}
.demo .l{position:absolute;left:14px;height:8px;border-radius:4px;background:#D5D5DB}
.demo .btnx{position:absolute;right:14px;top:34px;min-width:108px;max-width:150px;height:34px;padding:0 10px;border-radius:8px;border:1.5px solid #2F6FED;background:#fff;color:#2F6FED;font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;text-align:center;line-height:14px;animation:btn 3.6s ease-in-out infinite}
.demo .ring,.demo .finger{position:absolute;right:54px;top:36px;width:28px;height:28px;border-radius:14px}
.demo .ring{background:rgba(47,111,237,.5);animation:ring 3.6s ease-out infinite}
.demo .finger{background:rgba(29,29,34,.55);border:2px solid #fff;animation:finger 3.6s ease-in-out infinite}
.cap{margin:10px 0 12px;font-size:12px;line-height:16px;color:rgba(255,255,255,.7);text-align:center}
.txt{margin:10px 0 14px;font-size:13px;line-height:18px;color:rgba(255,255,255,.75)}
.b1{display:block;padding:13px;border-radius:14px;border:1.5px solid rgba(255,255,255,.35);font-size:15px;font-weight:700;text-align:center}
.b2{display:block;padding:16px;border-radius:14px;background:#FF6261;box-shadow:0 6px 0 #C43F32;font-size:15px;font-weight:700;text-align:center}
.warn{margin-top:22px;padding:12px 14px;border-radius:12px;background:rgba(255,90,90,.12);border:1px solid rgba(255,90,90,.5);color:#FF7A7A;font-size:13px;line-height:18px;font-weight:600}
.warn div+div{margin-top:6px}
@keyframes finger{0%{transform:translate(-44px,64px);opacity:0}15%{opacity:1}45%{transform:translate(0,0);opacity:1}52%{transform:scale(.8)}60%{transform:scale(1)}85%{opacity:1}100%{transform:translate(-44px,64px);opacity:0}}
@keyframes ring{0%,50%{transform:scale(.3);opacity:0}54%{opacity:.8}82%,100%{transform:scale(2.4);opacity:0}}
@keyframes btn{0%,50%{background:#fff;color:#2F6FED}54%,80%{background:#2F6FED;color:#fff}100%{background:#fff;color:#2F6FED}}
@media (prefers-reduced-motion:reduce){.demo .btnx,.demo .ring,.demo .finger{animation:none}.demo .ring{display:none}}
</style>
</head>

  <div class="bar">

    <div class="t" data-i="gTitle"></div>
  </div>
  <p class="intro" data-i="gIntro"></p>

  <div class="card">
    <div class="head"><div class="n">1</div><div data-i="s1"></div></div>

      <div class="top"><i></i><i></i><i></i></div>
      <div class="g">ps-androidtesters</div>
      <div class="l" style="top:62px;width:110px"></div>
      <div class="l" style="top:80px;width:80px"></div>
      <div class="l" style="top:112px;left:14px;right:14px;height:1px"></div>

  <div class="card">
    <div class="head"><div class="n">2</div><div data-i="s2"></div></div>
    <div class="txt" data-i="s2t"></div>

    <div class="warn"><div data-i="w1"></div><div data-i="w2"></div></div>
  </div>
</div>

function pick(list){
  for(var i=0;i<list.length;i++){
    var l=String(list[i]||'').toLowerCase().slice(0,2);
    if(T[l])return l;
  }
  return 'en';
}
var lang=pick(navigator.languages&&navigator.languages.length?navigator.languages:[navigator.language]);
var t=T[lang];
document.documentElement.lang=lang;
document.title=t.title;
document.querySelectorAll('[data-i]').forEach(function(e){e.textContent=t[e.getAttribute('data-i')]});
document.getElementById('joinLbl').textContent=t.join;
document.getElementById('cap').textContent=t.cap.replace('{b}',t.join);
function route(){
  var g=location.hash==='#android';
  document.getElementById('home').classList.toggle('hidden',g);
  document.getElementById('guide').classList.toggle('hidden',!g);
  window.scrollTo(0,0);
}
window.addEventListener('hashchange',route);
route();
